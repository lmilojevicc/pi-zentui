name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run fmt:check

      - name: Typecheck
        run: npm run typecheck

      - name: Dry-run pack
        run: npm run pack:check

  # The same suite under each terminal/glyph detection mode, in parallel instead
  # of four runs in a row.
  test:
    name: test (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [auto-fallback, forced-ascii, known-nerd-terminal, forced-nerd]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test ${{ matrix.mode }}
        env:
          MODE: ${{ matrix.mode }}
        run: |
          base=(env -u TERM_PROGRAM -u KITTY_WINDOW_ID -u ALACRITTY_SOCKET -u ZENTUI_NERD_FONTS TERM=dumb CI=true)
          case "$MODE" in
            auto-fallback)       "${base[@]}" npm test ;;
            forced-ascii)        "${base[@]}" ZENTUI_NERD_FONTS=0 npm test ;;
            known-nerd-terminal) "${base[@]}" TERM_PROGRAM=WezTerm npm test ;;
            forced-nerd)         "${base[@]}" ZENTUI_NERD_FONTS=1 npm test ;;
            *) echo "unknown mode $MODE" >&2; exit 1 ;;
          esac

  # The required check. One always-running job, so a failed, skipped or
  # cancelled dependency can never report green.
  verify:
    if: always()
    needs: [static, test]
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require every check
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do test "$result" = success; done

  thinking-experimental-tui:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test all-mode experimental actual TUI compatibility
        run: timeout --signal=TERM --kill-after=30s 15m npm run test:thinking-experimental-tui

  behavior-component-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Focused behavior coverage, not private-adapter or full-package certification.
      - name: Test matched Pi 1.0.0 and 1.0.3 behavior components
        run: npm run test:behavior-compatibility

  supported-pi-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pi-version: ["1.0.0", "1.0.3"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Pin matching Pi package versions
        env:
          PI_VERSION: ${{ matrix.pi-version }}
        run: |
          npm pkg set "devDependencies.@earendil-works/pi-ai=$PI_VERSION"
          npm pkg set "devDependencies.@earendil-works/pi-coding-agent=$PI_VERSION"
          npm pkg set "devDependencies.@earendil-works/pi-tui=$PI_VERSION"
          npm pkg set "devDependencies.@earendil-works/pi-agent-core=$PI_VERSION"
          # Match the public host family to avoid newer codemode declaration drift.
          for name in chord pi-codemode pi-mcp pi-telemetry; do
            npm pkg set "devDependencies.@earendil-works/$name=$PI_VERSION"
          done

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Attest Pi package versions
        env:
          PI_VERSION: ${{ matrix.pi-version }}
        run: |
          npm ls --depth=0 @earendil-works/pi-ai @earendil-works/pi-coding-agent @earendil-works/pi-tui
          node - <<'NODE'
          const names = ["pi-ai", "pi-coding-agent", "pi-tui", "pi-agent-core", "chord", "pi-codemode", "pi-mcp", "pi-telemetry"]
          for (const name of names) {
            const pkg = require(`./node_modules/@earendil-works/${name}/package.json`)
            if (pkg.version !== process.env.PI_VERSION) throw new Error(`${pkg.name}: ${pkg.version}`)
            console.log(pkg.name, pkg.version)
          }
          NODE

      - name: Typecheck supported Pi version
        run: npm run typecheck

      - name: Test supported Pi version
        run: timeout --signal=TERM --kill-after=30s 15m npm test
